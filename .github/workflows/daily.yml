name: daily-github-ai-trending

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00（GitHub 定时任务可能有最多约 30 分钟延迟）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 纯标准库实现，无需安装第三方依赖

      - name: Fetch trending & generate report
        run: python scripts/fetch_trending.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily report $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
